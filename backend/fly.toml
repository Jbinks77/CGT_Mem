app = "cmdmem-backend"
primary_region = "cdg"  # Paris

[build]

[env]
  DATABASE_PATH = "/data/cmdmem.db"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "cmdmem_data"
  destination = "/data"
  initial_size = "1gb"
