services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cmdmem
      POSTGRES_PASSWORD: cmdmem
      POSTGRES_DB: cmdmem
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/app/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmdmem"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://cmdmem:cmdmem@db:5432/cmdmem
      DATABASE_URL_SYNC: postgresql://cmdmem:cmdmem@db:5432/cmdmem
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: /api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
